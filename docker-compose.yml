version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: invision-u-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invision_u
      POSTGRES_USER: invision
      POSTGRES_PASSWORD: invision_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
