version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: invision-u-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invision_u
      POSTGRES_USER: invision
      POSTGRES_PASSWORD: invision_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invision-u-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - DATABASE_URL=postgresql://invision:invision_pass@postgres:5432/invision_u
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - postgres
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
